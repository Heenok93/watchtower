id: non_agentic_ai_health_systems
name: Non-Agentic AI & Health
description: Detects non-agentic applications of artificial intelligence to human health. The article
  must substantively study, develop, evaluate, validate, implement, regulate, or apply an AI method or
  system to a clearly identifiable human-health problem. This broad profile covers digital health and
  healthcare systems, patient-centered clinical medicine, laboratory diagnostics, human epidemiology and
  public health, and drug or vaccine development. Conventional machine-learning and deep-learning models,
  predictors, classifiers, decision-support systems, and non-agentic LLM applications are in scope; explicit
  agentic systems are handled by the Agentic AI & Health profile and should not be classified as non-agentic.
  A mere mention of AI, routine statistical analysis, agent-based simulation without AI, basic biology,
  omics or molecular research without a direct human-health application, and animal-only/veterinary work
  are out of scope. Secondary subcategories may overlap when more than one application domain is substantively
  central.
