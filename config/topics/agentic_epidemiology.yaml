id: agentic_epidemiology

name: Advanced AI in Epidemiology

description: >
  Applications of agentic AI, large language models,
  foundation models, generative AI, machine learning,
  and other advanced artificial intelligence methods
  to epidemiology, public health, disease surveillance,
  outbreak detection, epidemic intelligence, and
  infectious disease research.

