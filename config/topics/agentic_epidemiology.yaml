id: agentic_epidemiology
name: Advanced AI in Epidemiology

description: >-
  Veille sur les méthodes et applications d'intelligence artificielle
  avancée en épidémiologie et en santé publique : surveillance,
  analyse des populations, prévision et évaluation des interventions.
  La pertinence exige une relation substantielle entre la dimension IA
  et la dimension épidémiologique ou populationnelle.
  Une application clinique individuelle, une simulation causale
  classique ou une méthode IA généraliste ne suffit pas à elle seule.

required_groups:
  advanced_ai:
    terms:
      - artificial intelligence
      - machine learning
      - deep learning
      - neural network
      - neural networks
      - transformer
      - transformers
      - large language model
      - large language models
      - llm
      - llms
      - foundation model
      - foundation models
      - generative ai
      - agentic ai
      - ai agent
      - ai agents
      - multi-agent system
      - multi-agent systems

  epidemiology:
    terms:
      - epidemiology
      - epidemiological
      - epidemiologic
      - public health
      - population health
      - population-level health
      - disease surveillance
      - epidemiological surveillance
      - public health surveillance
      - outbreak
      - outbreaks
      - epidemic
      - epidemics
      - pandemic
      - pandemics
      - infectious disease modeling
      - infectious disease modelling

secondary_groups:
  advanced_ai:
    terms:
      - world model
      - world models
      - representation learning

  epidemiology:
    terms: []

include:
  any:
    - agentic ai
    - ai agent
    - ai agents
    - multi-agent system
    - multi-agent systems

  context:
