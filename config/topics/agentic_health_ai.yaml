id: agentic_health_ai
name: Agentic AI & Health
description: 'Detects agentic or autonomous AI systems applied to human health. The defining requirement
  is genuine agentic behavior: explicit planning, autonomous multi-step execution, tool use, action selection,
  delegation, or orchestration of AI agents with limited human intervention. Relevant systems include
  AI agents, LLM-based agents, multi-agent systems, and autonomous clinical, laboratory, public-health,
  or drug-development workflows. A conventional predictive model, classifier, chatbot, LLM interface,
  clinical decision-support system, or fixed rule-based automation is not agentic by itself. The health
  application must be direct and identifiable in human medicine, patient care, clinical research, laboratory
  diagnostics, drug or vaccine development, healthcare systems, epidemiology, or public health. Animal-only/veterinary
  applications and basic biological or computational research without a direct human-health application
  are out of scope. Agentic applications in drug development may also match the Drug Development subcategory.'
