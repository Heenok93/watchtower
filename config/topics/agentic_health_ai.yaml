id: agentic_health_ai
name: Agentic AI & Health

description: >-
  Veille sur les systèmes d'IA agentiques ou autonomes appliqués à la santé humaine,
  à la médecine, aux soins, aux systèmes de santé et à la santé publique. La composante
  agentique est le critère principal : l'article doit décrire explicitement un agent IA,
  un système agentique, un agent autonome, un système multi-agent, une orchestration
  d'agents ou un LLM agissant comme agent. La simple présence d'une méthode d'IA,
  d'un LLM, d'un chatbot médical ou d'une automatisation conventionnelle ne suffit pas.
  Les travaux de découverte de médicaments, de conception moléculaire, d'omics et de
  biologie computationnelle sont exclus par défaut pour réserver ces sujets à une veille
  spécialisée ultérieure, sauf si l'application santé/soins est clairement distincte
  et constitue le sujet principal. Les applications cliniques, hospitalières,
  médico-administratives, de recherche médicale et de santé publique sont dans le périmètre.

