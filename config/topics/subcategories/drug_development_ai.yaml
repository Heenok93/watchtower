id: drug_development_ai
name: Drug Development & AI
description: Covers AI applications to the discovery, design, screening, optimization, and development
  of therapeutic drugs and vaccines. In scope are target identification and validation, hit identification,
  virtual and high-throughput screening, molecular or biologic design and generation, lead optimization,
  drug repurposing when it is part of therapeutic development, ADMET and toxicity assessment in the development
  pipeline, preclinical evaluation, and clinical development or trials evaluating a new drug or vaccine.
  The AI method must materially contribute to the therapeutic development task. Developing or evaluating
  an AI model, clinical prediction tool, or healthcare application is not Drug Development merely because
  it uses medication-related data or mentions a treatment. Routine prescribing, medication adherence,
  drug utilization, pharmacovigilance, and patient-level treatment-response prediction are out of scope
  unless they are explicitly part of the development or evaluation of a new therapeutic product. Human-health
  relevance is required; animal-only veterinary drug development is out of scope. Agentic and non-agentic
  AI may both qualify, and agentic drug-development papers may also match Agentic AI & Health.
