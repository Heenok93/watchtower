id: clinical_medicine_ai
name: Clinical Medicine & Precision Medicine AI
description: Covers AI applications whose central purpose is patient-centered clinical medicine or precision
  medicine. In scope are individual diagnosis and screening, imaging interpretation, prognosis, individual
  risk stratification, prediction of treatment response or toxicity, treatment selection, personalized
  treatment, precision oncology, surgery, and other clinical specialties. Omics, genomic, proteomic, and
  multimodal data are in scope when they are explicitly used for a clinical purpose such as diagnosis,
  prognosis, patient characterization, or treatment selection or adaptation; their mere use as biological
  predictors in general research is insufficient. Population-level epidemiology and outbreak surveillance,
  healthcare operations and infrastructure, and clinical laboratory operations belong to their respective
  subcategories unless a substantial patient-level clinical application is also central. Agentic and non-agentic
  systems can both qualify; agentivity is neither necessary nor sufficient.
