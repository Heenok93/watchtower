id: epidemics_ai
name: Epidemics & AI
description: 'Covers AI applications to population-level epidemiological tasks in human health: disease
  surveillance, outbreak detection, early warning, epidemic forecasting or nowcasting, incidence monitoring,
  transmission dynamics, and the geographic or temporal spread of disease. A relevant article must have
  an explicit population-level epidemiological objective and an AI/ML method materially involved in the
  task. The presence of an infectious disease, a generic public-health context, a patient-level prediction,
  or an AI method alone is insufficient. Individual diagnosis, screening, prognosis, medical imaging,
  therapeutic education, general healthcare services, and drug discovery or development are out of scope
  unless a distinct population-level surveillance or epidemiological modeling task is also central. Classical
  mechanistic, compartmental, causal, statistical, or Bayesian models without an explicit AI/ML component
  are out of scope. Agentic systems may qualify when they perform or support a population-level epidemiological
  task; agentivity is neither necessary nor sufficient.'
