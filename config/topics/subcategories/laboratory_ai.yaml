id: laboratory_ai
name: Laboratory AI — Clinical Diagnostics and Laboratory Operations (v2)
description: Covers AI methods directly applied to human clinical laboratory medicine and diagnostic laboratory
  operations. In scope are clinical pathology and digital pathology, histology and cytology, morphological
  hematology, diagnostic microbiology, clinical chemistry, in-vitro diagnostics, interpretation and validation
  of laboratory test results, analytical quality control, specimen or sample processing, and laboratory
  automation or robotics when AI materially contributes to the task. Agentic and non-agentic systems may
  qualify; agentivity alone is insufficient. The use of laboratory measurements as predictors in a general
  clinical study is not enough. General radiology or clinical imaging, patient-level prognosis outside
  laboratory diagnostics, basic or non-clinical biology, omics research without a direct diagnostic application,
  molecular biology research, and drug discovery or development are out of scope.
