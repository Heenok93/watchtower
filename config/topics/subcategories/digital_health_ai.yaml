id: digital_health_ai
name: Digital Health & AI
description: Covers AI applications whose central object is digital health infrastructure, healthcare
  information systems, connected devices, or the organization and delivery of digitally enabled care.
  In scope are electronic health records, clinical documentation and ambient AI, clinical notes, telehealth
  and remote monitoring, wearables and medical devices, health information systems, interoperability,
  clinical and administrative workflows, healthcare operations, implementation, adoption, usability, safety,
  governance, and organizational impact. The article must substantively address an AI-enabled digital
  tool, system, workflow, or its implementation; merely using EHR data as a dataset does not make a study
  Digital Health. Patient-level diagnosis, prognosis, imaging, or treatment belongs primarily to Clinical
  Medicine when the clinical task is central, but overlap is appropriate when the digital system itself
  is also a central object. Agentic and non-agentic systems may qualify; agentivity alone is insufficient.
