id: automated_reviews

name: Automated Evidence Reviews

description: >
  Methods and applications that use AI or computational approaches
  to automate or assist scientific literature reviews and research
  evidence synthesis. Eligible tasks include literature searching,
  citation screening, study selection, extraction of data from
  research studies, risk-of-bias assessment, synthesis, and review
  updating. These tasks qualify only when explicitly applied to
  scientific literature or research evidence synthesis.
  Generic document annotation, data retrieval, fact-checking,
  software verification, and dataset generation do not qualify
  without an explicit application to this workflow.
  
