id: outbreak_forecasting

name: AI/ML for Outbreak Detection and Forecasting

description: >
  Methods and applications using machine learning, deep learning,
  artificial intelligence, or related computational learning methods
  to detect infectious disease outbreaks, provide early warning,
  forecast cases or incidence during outbreaks, or predict the temporal
  or spatio-temporal evolution, spread, intensity, peak, trajectory,
  or geographic propagation of epidemics and outbreaks.

  Relevant studies must establish a substantive relationship between
  an AI/ML method and an infectious-disease outbreak detection or
  forecasting task at population level.

  Relevant tasks include outbreak detection, epidemic early warning,
  forecasting of cases or incidence, prediction of epidemic peaks,
  short- or medium-term epidemic forecasting, and spatial or
  spatio-temporal prediction of infectious-disease spread.

  Individual-level diagnosis, prognosis, clinical outcome prediction,
  image classification, drug discovery, and generic time-series or
  forecasting methods without an infectious-disease outbreak
  application are outside scope.

  Purely mechanistic, compartmental, causal, statistical, or Bayesian
  epidemic models are outside scope unless they are explicitly combined
  with, compared against, or augmented by machine learning or deep
  learning methods.


